<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Wheels Cars</title>

<style>
:root {
    --red: #e10600;
    --bg: #f4f4f4;
    --card: #ffffff;
    --text: #222;
}

body.dark {
    --bg: #0f0f0f;
    --card: #1c1c1c;
    --text: #f4f4f4;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

/* HEADER */
header {
    background: linear-gradient(90deg, var(--red), #ff4d4d);
    color: white;
    padding: 30px;
    text-align: center;
}

header h1 {
    font-size: 2.5rem;
}

header p {
    opacity: 0.9;
}

/* CONTROLS */
.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 20px;
}

.controls button {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: var(--red);
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

.controls button:hover {
    transform: scale(1.05);
}

/* MAIN */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.car-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

/* CARD */
.car {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    transition: 0.3s;
}

.car:hover {
    transform: translateY(-6px);
}

.car img {
    width: 100%;
    height: 160px;
    object-fit: cover;
}

.car-content {
    padding: 15px;
}

.car-content h3 {
    margin-bottom: 5px;
}

.car-content p {
    font-size: 0.9rem;
    opacity: 0.85;
}

.price {
    font-weight: bold;
    margin: 10px 0;
    color: var(--red);
    font-size: 1.1rem;
}

.buy {
    width: 100%;
    padding: 10px;
    border: none;
    background: var(--red);
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    background: #111;
    color: #aaa;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
    <h1>🔥 Hot Wheels Garage</h1>
    <p>Collect • Race • Dominate</p>
</header>

<div class="controls">
    <button onclick="filterCars('all')">All</button>
    <button onclick="filterCars('race')">Race</button>
    <button onclick="filterCars('classic')">Classic</button>
    <button onclick="filterCars('future')">Future</button>
    <button onclick="toggleDark()">🌙 Dark Mode</button>
</div>

<div class="container">
    <div class="car-gallery" id="gallery"></div>
</div>

<footer>
    © 2026 Hot Wheels Fan Website | Built with ❤️
</footer>

<script>
const PRICE = 300; // fixed price for all cars

const cars = [
    {
        name: "Twin Mill",
        type: "race",
        image: "https://via.placeholder.com/400x300/e10600/ffffff?text=Twin+Mill",
        desc: "Twin-engine legendary racer."
    },
    {
        name: "Deora II",
        type: "future",
        image: "https://via.placeholder.com/400x300/005eff/ffffff?text=Deora+II",
        desc: "Futuristic surf-style car."
    },
    {
        name: "56 Chevy",
        type: "classic",
        image: "https://via.placeholder.com/400x300/00a650/ffffff?text=56+Chevy",
        desc: "Vintage American hot rod."
    }
];

const gallery = document.getElementById("gallery");

function renderCars(list) {
    gallery.innerHTML = "";
    list.forEach(car => {
        const div = document.createElement("div");
        div.className = "car";
        div.innerHTML = `
            <img src="${car.image}" alt="${car.name}">
            <div class="car-content">
                <h3>${car.name}</h3>
                <p>${car.desc}</p>
                <div class="price">₹${PRICE}</div>
                <button class="buy" onclick="buyCar('${car.name}')">
                    Buy Now
                </button>
            </div>
        `;
        gallery.appendChild(div);
    });
}

function filterCars(type) {
    if (type === "all") {
        renderCars(cars);
    } else {
        renderCars(cars.filter(car => car.type === type));
    }
}

function buyCar(name) {
    alert(`🛒 ${name} added to cart for ₹${PRICE}`);
}

function toggleDark() {
    document.body.classList.toggle("dark");
}

// Initial load
renderCars(cars);
</script>

</body>
</html>
